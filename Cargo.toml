[package]
name = "paperhelper"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
dotenvy = "0.15"
owo-colors = "4"
rustyline = "14"
axum = { version = "0.7", features = ["json", "multipart"] }
tokio-stream = "0.1"

# Windows 桌面壳（src/bin/paperhelper-desktop.rs）：把 `paperhelper web` 装进 WebView2 原生窗口。
# 仅 Windows 编译，其他平台 `cargo build` 不受影响（源码里按 cfg 门控）。
[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
