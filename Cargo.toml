[package]
name = "paperhelper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
dotenvy = "0.15"
owo-colors = "4"
rustyline = "14"
