<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperHelper — 论文学习助手</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">PaperHelper <span class="sub">论文学习助手</span></div>
  <div class="model" id="model"></div>
  <div class="actions">
    <button id="btn-config" class="ghost">配置</button>
    <button id="btn-refresh" class="ghost">刷新</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <section>
      <h3>用量</h3>
      <div id="usage" class="usage"></div>
    </section>
    <section>
      <h3>对话轨迹
        <span class="tree-actions">
          <button id="btn-del" class="mini danger" title="删除当前节点及其子树">删除</button>
          <button id="btn-undo" class="mini" title="撤销上一次删除">撤销</button>
        </span>
      </h3>
      <ul id="tree" class="tree"><li class="muted">（尚无对话）</li></ul>
    </section>
    <section>
      <h3>会话历史</h3>
      <ul id="sessions" class="session-list"><li class="muted">（无）</li></ul>
    </section>
    <section>
      <h3>已读论文</h3>
      <ul id="papers" class="plain"><li class="muted">（无）</li></ul>
    </section>
    <section>
      <h3>已学概念</h3>
      <ul id="concepts" class="plain"><li class="muted">（无）</li></ul>
    </section>
  </aside>

  <main id="main">
    <div class="tabs" id="tabs">
      <button class="tab active" data-key="note">笔记</button>
      <button class="tab" data-key="console">控制台</button>
      <span class="spacer" id="tab-spacer"></span>
      <span id="progress" class="progress"></span>
    </div>

    <div class="panes" id="panes">
      <div id="pane-note" class="pane active" data-key="note">
        <iframe id="note-frame" src="/api/note?format=html" title="笔记"></iframe>
      </div>
      <div id="pane-console" class="pane" data-key="console">
        <pre id="console"></pre>
      </div>
    </div>

    <form id="cmd-form" class="cmdbar">
      <div class="cmd-wrap">
        <input id="cmd-input" type="text" placeholder="输入 / 选择命令，或直接输入问题提问…" autocomplete="off" autofocus>
        <ul id="cmd-suggest" class="suggest hidden"></ul>
      </div>
      <button type="submit" id="btn-send" class="primary">发送</button>
    </form>
  </main>
</div>

<div id="ctx-menu" class="ctx-menu hidden"></div>

<div id="config-modal" class="modal hidden">
  <div class="modal-box">
    <h2>模型与预算配置</h2>
    <label>API Endpoint<input id="cfg-endpoint" placeholder="https://api.deepseek.com/v1/chat/completions"></label>
    <label>API Key<input id="cfg-key" placeholder="留空则不修改（当前：—）"></label>
    <label>模型<input id="cfg-model" placeholder="deepseek-v4-pro"></label>
    <label>上下文长度（token）<input id="cfg-context" type="number"></label>
    <label class="check"><input id="cfg-thinking" type="checkbox"> 思考模式</label>
    <label>输入单价 / 1M token<input id="cfg-inprice" type="number" step="0.01"></label>
    <label>输出单价 / 1M token<input id="cfg-outprice" type="number" step="0.01"></label>
    <label>Token 预算（0=不限）<input id="cfg-budget" type="number"></label>
    <div class="modal-actions">
      <button id="btn-config-cancel" class="ghost">取消</button>
      <button id="btn-config-save" class="primary">保存</button>
    </div>
    <p id="cfg-status" class="status"></p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
